<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Flappy Bird HTML5</title>
<style>
    body {
        margin: 0;
        background: #70c5ce;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    canvas {
        border: 2px solid #000;
        background: linear-gradient(#70c5ce, #fff);
    }

    .info {
        position: absolute;
        top: 20px;
        text-align: center;
        color: #fff;
        font-size: 24px;
        text-shadow: 2px 2px 0 #000;
        width: 100%;
    }
</style>
</head>
<body>

<div class="info" id="info">Clique ou appuie sur ESPACE pour commencer</div>
<canvas id="game" width="320" height="480"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

// ===== ÉTAT DU JEU =====
// Utilisation de var pour exposition globale (testing)
var gameStarted = false;
var gameOver = false;
var score = 0;
var pipesSpawned = 0;
var godMode = false;

// Cheat Code
const CHEAT_SEQUENCE = ['d', 'f'];
let cheatProgress = 0;

document.addEventListener("keydown", (e) => {
    if (e.shiftKey) {
        if (e.key.toLowerCase() === CHEAT_SEQUENCE[cheatProgress]) {
            cheatProgress++;
            if (cheatProgress === CHEAT_SEQUENCE.length) {
                godMode = !godMode;
                console.log("God Mode: " + godMode);
                info.textContent = godMode ? "GOD MODE ACTIF" : "";
                setTimeout(() => { if(gameStarted && !gameOver) info.textContent = ""; }, 2000);
                cheatProgress = 0;
            }
        } else {
             if (e.key !== "Shift") cheatProgress = 0;
        }
    } else {
        cheatProgress = 0;
    }
});

// ===== OISEAU =====
var bird = {
    x: 60,
    y: 200,
    radius: 12,
    velocity: 0,
    gravity: 0.5,
    jump: -8
};

// ===== TUYAUX =====
var pipes = [];
const pipeWidth = 50;
const pipeGap = 120;
let pipeTimer = 0;

// ===== FOND (NUAGES) =====
var clouds = [];
let cloudTimer = 0;

// ===== BOSS =====
var boss = {
    active: false,
    x: 0,
    y: 0,
    radius: 40,
    vy: 2,
    timer: 0
};

// ===== CONTRÔLES =====
function flap() {
    if (!gameStarted) {
        gameStarted = true;
        info.textContent = "";
    }
    if (!gameOver) {
        bird.velocity = bird.jump;
    } else {
        resetGame();
    }
}

document.addEventListener("keydown", e => {
    if (e.code === "Space") flap();
});

document.addEventListener("click", flap);

// ===== RESET =====
function resetGame() {
    bird.y = 200;
    bird.velocity = 0;
    pipes.length = 0;
    clouds.length = 0;
    score = 0;
    pipesSpawned = 0;
    gameOver = false;
    gameStarted = false;
    info.textContent = "Clique ou appuie sur ESPACE pour commencer";
}

// ===== DESSINS =====
function drawClouds() {
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.5, c.size * 1.2, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 1.6, c.y, c.size * 0.9, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawBird() {
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fillStyle = godMode ? "orange" : "yellow";
    ctx.fill();
    ctx.stroke();
}

function drawBoss() {
    if (!boss.active) return;
    ctx.fillStyle = "purple";
    ctx.beginPath();
    ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Yeux menaçants
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(boss.x - 15, boss.y - 10, 10, 0, Math.PI * 2);
    ctx.arc(boss.x + 15, boss.y - 10, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(boss.x - 15, boss.y - 10, 3, 0, Math.PI * 2);
    ctx.arc(boss.x + 15, boss.y - 10, 3, 0, Math.PI * 2);
    ctx.fill();
}

function drawPipes() {
    pipes.forEach(p => {
        if (p.type === 'hoop') {
            // Dessin du cerceau
            ctx.beginPath();
            ctx.arc(p.x + pipeWidth/2, p.y, p.radius, 0, Math.PI * 2);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 5;
            ctx.stroke();
            // Effet 3D léger (anneau arrière)
            ctx.beginPath();
            ctx.arc(p.x + pipeWidth/2, p.y, p.radius, Math.PI/2, 3*Math.PI/2);
            ctx.strokeStyle = "darkred";
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // Dessin des tuyaux classiques
            ctx.fillStyle = "green";
            ctx.fillRect(p.x, 0, pipeWidth, p.top);
            ctx.fillRect(p.x, p.bottom, pipeWidth, canvas.height - p.bottom);
        }
    });
}

function drawScore() {
    ctx.fillStyle = "#fff";
    ctx.font = "30px Arial";
    ctx.textAlign = "center";
    ctx.fillText(score, canvas.width / 2, 50);
}

// ===== LOGIQUE =====
function update() {
    if (!gameStarted || gameOver) return;

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Sol
    if (!godMode && bird.y + bird.radius > canvas.height) {
        endGame();
    }

    // Nuages (Parallaxe)
    cloudTimer++;
    if (cloudTimer > 150) {
        clouds.push({
            x: canvas.width + 50,
            y: Math.random() * (canvas.height / 2),
            size: 20 + Math.random() * 20,
            speed: 0.5 + Math.random() * 0.5
        });
        cloudTimer = 0;
    }
    clouds.forEach(c => {
        c.x -= c.speed;
    });
    // Nettoyage nuages
    if (clouds.length && clouds[0].x < -100) {
        clouds.shift();
    }

    // LOGIQUE BOSS
    // Apparition tous les 100 points
    if (score > 0 && score % 100 === 0 && !boss.active && pipeTimer === 0) {
        boss.active = true;
        boss.x = canvas.width - 50;
        boss.y = canvas.height / 2;
        boss.timer = 0;
        // On clear les tuyaux pour le combat
        pipes.length = 0;
    }

    if (boss.active) {
        // Mouvement Boss
        boss.timer++;

        // Oscillation verticale
        boss.y += Math.sin(boss.timer * 0.05) * 5;

        // Attaque (charge vers la gauche)
        if (boss.timer > 100) {
            boss.x -= 3;
        }

        // Fin du boss si sort de l'écran
        if (boss.x < -boss.radius) {
            boss.active = false;
            score += 1; // Évite la boucle infinie (100%100 === 0)
            // Reprendre le spawn normal
            pipeTimer = 0;
        }

        // Collision Boss
        let dx = bird.x - boss.x;
        let dy = bird.y - boss.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (!godMode && dist < bird.radius + boss.radius) {
            endGame();
        }

    } else {
        // Tuyaux (seulement si pas de boss)
        pipeTimer++;
        if (pipeTimer > 90) {
            pipesSpawned++;

            let isHoop = pipesSpawned >= 40;
            let isMoving = pipesSpawned >= 20;
            let vy = isMoving ? (Math.random() < 0.5 ? 1 : -1) * 1 : 0;

            if (isHoop) {
                let centerY = Math.random() * (canvas.height - 200) + 100;
                pipes.push({
                    type: 'hoop',
                    x: canvas.width,
                    y: centerY,
                    radius: 50,
                    passed: false,
                    vy: vy
                });
            } else {
                const topHeight = Math.random() * 200 + 50;
                pipes.push({
                    type: 'pipe',
                    x: canvas.width,
                    top: topHeight,
                    bottom: topHeight + pipeGap,
                    passed: false,
                    vy: vy
                });
            }
            pipeTimer = 0;
        }
    }

    pipes.forEach(p => {
        p.x -= 2;

        // Mouvement vertical
        if (p.type === 'hoop') {
            p.y += p.vy;
            if (p.y < 50 || p.y > canvas.height - 50) {
                p.vy *= -1;
            }

            // Collision Cerceau
            // On vérifie si l'oiseau touche l'anneau.
            // Le "trou" est au centre. L'anneau a un rayon de 30.
            // Collision si distance > radius - birdRadius (intérieur anneau)
            // MAIS seulement si on est dans la tranche X de l'anneau.
            // Simplification: le cerceau est plat en X (ligne verticale), mais on va lui donner une largeur virtuelle de pipeWidth.

            let dx = bird.x - (p.x + pipeWidth/2);
            let dy = bird.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            // Si on est proche horizontalement
            if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth) {
                // Si on touche le bord du cercle
                // L'oiseau passe si dist < p.radius - bird.radius (il est bien au centre)
                // Sinon collision
                // Attention: si l'oiseau passe A CÔTÉ du cerceau (au dessus/dessous), c'est safe ?
                // "Remplacer par des cerceaux" -> Obstacle = Cerceau.
                // En Flappy Bird, on doit passer DANS le trou. Tout le reste est mortel ?
                // Si je fais des murs invisibles haut/bas, c'est dur.
                // Si je laisse passer autour, c'est trop facile.
                // Je vais considérer que toucher l'anneau est mortel, mais passer à côté ne rapporte pas de points ?
                // Non, restons simple : Collision avec l'anneau = Mort.
                // Anneau est un tore d'épaisseur 5.
                // Collision si distance est proche du rayon ?

                // Meilleure approche "Jeu vidéo" :
                // L'obstacle est un MUR avec un TROU CIRCULAIRE.
                // Mais "cerceau" veut dire juste l'anneau.
                // Je vais dire : Si on touche l'anneau (distance ~ rayon), mort.
                if (!godMode && dist > p.radius - bird.radius && dist < p.radius + bird.radius + 5) {
                    endGame();
                }
            }

        } else {
            // Mouvement Tuyau
            p.top += p.vy;
            p.bottom += p.vy;

            if (p.top < 20 || p.bottom > canvas.height - 20) {
                p.vy *= -1;
            }

            // Collision Tuyau
            if (
                !godMode &&
                bird.x + bird.radius > p.x &&
                bird.x - bird.radius < p.x + pipeWidth &&
                (bird.y - bird.radius < p.top ||
                 bird.y + bird.radius > p.bottom)
            ) {
                endGame();
            }
        }

        // Score
        if (!p.passed && p.x + pipeWidth < bird.x) {
            score++;
            p.passed = true;
        }
    });

    // Nettoyage
    if (pipes.length && pipes[0].x < -pipeWidth) {
        pipes.shift();
    }
}

function endGame() {
    gameOver = true;
    info.textContent = "Game Over – Clique ou ESPACE pour rejouer";
}

// ===== BOUCLE PRINCIPALE =====
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    update();
    drawClouds();
    drawPipes();
    drawBoss();
    drawBird();
    drawScore();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
