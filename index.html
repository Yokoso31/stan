<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Neon Stick Fight</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #0f2027, #000);
        font-family: 'Segoe UI', sans-serif;
        color: white;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: linear-gradient(#050505, #0a0a0a);
        box-shadow: 0 0 40px #00ffff;
    }

    #ui {
        position: absolute;
        top: 10px;
        width: 100%;
        display: flex;
        justify-content: space-around;
        pointer-events: none;
    }

    .bar {
        width: 300px;
        height: 20px;
        border: 2px solid #00ffff;
        box-shadow: 0 0 10px #00ffff;
    }

    .hp {
        height: 100%;
        background: linear-gradient(90deg, #00ffff, #00ff99);
    }

    h1 {
        text-align: center;
        margin: 10px;
        text-shadow: 0 0 15px #00ffff;
    }

    .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 10;
        pointer-events: auto;
    }

    .hidden {
        display: none !important;
    }

    .menu-content {
        text-align: center;
        border: 2px solid #00ffff;
        padding: 40px;
        box-shadow: 0 0 20px #00ffff;
        background: rgba(0, 0, 0, 0.9);
    }

    .color-picker-row {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin: 20px 0;
    }

    .player-config {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: white;
    }

    input[type="color"] {
        width: 60px;
        height: 60px;
        border: 2px solid white;
        background: none;
        cursor: pointer;
    }

    button {
        padding: 15px 40px;
        font-size: 24px;
        background: transparent;
        color: #00ffff;
        border: 2px solid #00ffff;
        box-shadow: 0 0 10px #00ffff;
        cursor: pointer;
        font-family: 'Segoe UI', sans-serif;
        text-transform: uppercase;
        font-weight: bold;
        transition: all 0.3s;
    }

    button:hover {
        background: #00ffff;
        color: black;
        box-shadow: 0 0 30px #00ffff;
    }

    #gameover-title {
        font-size: 64px;
        color: #ff00ff;
        text-shadow: 0 0 20px #ff00ff;
        margin-bottom: 20px;
    }

    #winner-text {
        font-size: 32px;
        margin-bottom: 40px;
        color: white;
    }
</style>
</head>
<body>

<!-- UI Overlay for Gameplay -->
<div id="ui" class="hidden">
    <h1>⚔️ NEON STICK FIGHT ⚔️</h1>
    <div style="display: flex; justify-content: space-around; width: 100%;">
        <div class="bar"><div id="hp1" class="hp"></div></div>
        <div class="bar"><div id="hp2" class="hp"></div></div>
    </div>
</div>

<!-- Start Screen -->
<div id="start-screen" class="screen">
    <div class="menu-content">
        <h1 style="font-size: 48px; margin-bottom: 30px;">NEON STICK FIGHT</h1>
        <div class="color-picker-row">
            <div class="player-config">
                <h3>JOUEUR 1</h3>
                <input type="color" id="p1-color" value="#00ffff">
            </div>
            <div class="player-config">
                <h3>JOUEUR 2</h3>
                <input type="color" id="p2-color" value="#ff00ff">
            </div>
        </div>
        <button id="start-btn">JOUER</button>
    </div>
</div>

<!-- Game Over Screen -->
<div id="game-over-screen" class="screen hidden">
    <div class="menu-content">
        <h1 id="gameover-title">GAME OVER</h1>
        <div id="winner-text">PLAYER 1 WINS!</div>
        <button id="restart-btn">REJOUER</button>
    </div>
</div>

<canvas id="game" width="1000" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRAVITY = 0.6;
const GROUND = 420;

// Game State
let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
let freezeFrames = 0;
let shake = 0;
let bullets = [];

// UI Elements
const uiDiv = document.getElementById("ui");
const startScreen = document.getElementById("start-screen");
const gameOverScreen = document.getElementById("game-over-screen");
const startBtn = document.getElementById("start-btn");
const restartBtn = document.getElementById("restart-btn");
const p1ColorInput = document.getElementById("p1-color");
const p2ColorInput = document.getElementById("p2-color");
const winnerText = document.getElementById("winner-text");

// Event Listeners for UI
startBtn.addEventListener("click", () => {
    gameState = "PLAYING";
    startScreen.classList.add("hidden");
    uiDiv.classList.remove("hidden");
    resetGame();
});

restartBtn.addEventListener("click", () => {
    resetGame();
    gameState = "MENU";
    gameOverScreen.classList.add("hidden");
    startScreen.classList.remove("hidden");
});

p1ColorInput.addEventListener("input", (e) => {
    p1.color = e.target.value;
    p1.originalColor = e.target.value;
});

p2ColorInput.addEventListener("input", (e) => {
    p2.color = e.target.value;
    p2.originalColor = e.target.value;
});

// Bullet Logic
class Bullet {
    constructor(x, y, vx, color, owner) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.color = color;
        this.owner = owner;
        this.active = true;
        this.width = 15;
        this.height = 5;
    }

    update() {
        this.x += this.vx;
        // Off screen check
        if (this.x < 0 || this.x > canvas.width) this.active = false;
    }

    draw() {
        if (!this.active) return;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.shadowBlur = 0;
    }
}

// Pistol Drop Logic
class PistolDrop {
    constructor() {
        this.active = false;
        this.x = 0;
        this.y = 0;
        this.vy = 0;
        this.width = 30;
        this.height = 20;
        this.spawnTimer = 0;
    }

    reset() {
        this.active = false;
        this.spawnTimer = 0;
    }

    update() {
        // Spawn Logic
        if (!this.active) {
            this.spawnTimer++;
            // Rare spawn (every ~10s or 600 frames)
            if (this.spawnTimer > 600 && Math.random() < 0.005) {
                this.active = true;
                this.x = 100 + Math.random() * (canvas.width - 200);
                this.y = -50; // Start above screen
                this.vy = 0;
                this.spawnTimer = 0;
            }
            return;
        }

        // Falling Logic
        this.y += this.vy;
        if (this.y < GROUND) {
            this.vy += GRAVITY;
        } else {
            this.y = GROUND;
            this.vy = 0;
        }
    }

    draw() {
        if (!this.active) return;

        ctx.save();
        ctx.translate(this.x, this.y - 20); // Draw anchored at bottom

        // Draw Pistol Shape
        ctx.fillStyle = "#FFF";
        ctx.strokeStyle = "#00FFFF";
        ctx.lineWidth = 2;
        ctx.shadowColor = "#00FFFF";
        ctx.shadowBlur = 15;

        ctx.beginPath();
        // L shape
        ctx.moveTo(0, 0);
        ctx.lineTo(20, 0); // Barrel
        ctx.lineTo(20, 10);
        ctx.lineTo(5, 10);
        ctx.lineTo(5, 20); // Handle
        ctx.lineTo(0, 20);
        ctx.closePath();

        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }
}

const pistolDrop = new PistolDrop();

// Power Block logic
class PowerBlock {
    constructor() {
        this.active = false;
        this.width = 40;
        this.height = 40;
        this.x = 0;
        this.y = 0;
        this.spawnTimer = 0;
        this.type = "damage"; // damage, shield, health
    }

    reset() {
        this.active = false;
        this.spawnTimer = 0;
    }

    update() {
        if (this.active) return; // Already spawned

        // Random spawn every ~5 seconds (300 frames)
        this.spawnTimer++;
        if (this.spawnTimer > 300 && Math.random() < 0.01) {
            this.active = true;
            this.x = 100 + Math.random() * (canvas.width - 200); // Random X
            this.y = GROUND - 80 - Math.random() * 80;

            // Randomize Type
            const r = Math.random();
            if (r < 0.4) this.type = "damage";
            else if (r < 0.7) this.type = "shield";
            else this.type = "health";

            this.spawnTimer = 0;
        }
    }

    draw() {
        if (!this.active) return;

        let color = "#FFD700"; // Gold (Damage)
        let text = "P";

        if (this.type === "shield") {
            color = "#00FFFF"; // Cyan (Shield)
            text = "S";
        } else if (this.type === "health") {
            color = "#00FF00"; // Green (Health)
            text = "+";
        }

        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        // Inner detail
        ctx.strokeStyle = "#FFF";
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y, this.width, this.height);

        // Pulse effect or text
        ctx.fillStyle = "black";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, this.x + this.width/2, this.y + this.height/2 + 2);
    }
}

const powerBlock = new PowerBlock();

class Fighter {
    constructor(x, color, controls) {
        this.startX = x; // Store initial X
        this.x = x;
        this.y = GROUND;
        this.vx = 0;
        this.vy = 0;
        this.width = 40;
        this.height = 80;
        this.color = color;
        this.originalColor = color;
        this.health = 100;
        this.attacking = false;
        this.controls = controls;
        this.facing = 1;
        this.invincible = false;
        this.hasPower = false;
        this.hasShield = false;
        this.attackCooldown = false;

        // Pistol State
        this.hasPistol = false;
        this.ammo = 0;
    }

    reset() {
        this.x = this.startX;
        this.y = GROUND;
        this.vx = 0;
        this.vy = 0;
        this.health = 100;
        this.attacking = false;
        this.invincible = false;
        this.hasPower = false;
        this.hasShield = false;
        this.attackCooldown = false;
        this.hasPistol = false;
        this.ammo = 0;
        this.color = this.originalColor;
        this.facing = this.startX < 500 ? 1 : -1; // Face center
    }

    collectPower(type) {
        if (type === "damage") {
            this.hasPower = true;
            this.color = "#FFD700"; // Gold
            setTimeout(() => {
                this.hasPower = false;
                this.color = this.originalColor;
            }, 5000); // 5 seconds duration
        } else if (type === "shield") {
            this.hasShield = true;
        } else if (type === "health") {
            this.health = Math.min(100, this.health + 30);
        }
    }

    draw() {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.hasPower ? 30 : 15; // More glow if powered

        // Visual indicator for invincibility (blinking/opacity)
        if (this.invincible) {
            ctx.globalAlpha = 0.5;
        }

        // Tête
        ctx.beginPath();
        ctx.arc(this.x, this.y - 70, 10, 0, Math.PI * 2);
        ctx.stroke();

        // Corps
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 60);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();

        // Bras
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 40);
        // Arm position changes if holding pistol
        if (this.hasPistol) {
             // Aim straight
             ctx.lineTo(this.x + 40 * this.facing, this.y - 40);
        } else {
             ctx.lineTo(this.x + (this.attacking ? 60 * this.facing : 25 * this.facing), this.y - 30);
        }
        ctx.stroke();

        // Draw Pistol in hand
        if (this.hasPistol) {
            ctx.fillStyle = "#FFF";
            ctx.fillRect(this.x + 40 * this.facing, this.y - 45, 20 * this.facing, 10);
            ctx.fillRect(this.x + 40 * this.facing, this.y - 45, 5 * this.facing, 15);
        }

        // Attack visual effect (Melee only)
        if (this.attacking && !this.hasPistol) {
             ctx.beginPath();
             ctx.strokeStyle = this.hasPower ? "#FFD700" : "white";
             ctx.lineWidth = this.hasPower ? 6 : 2; // Bigger swipe if powered
             ctx.moveTo(this.x + 40 * this.facing, this.y - 45);
             ctx.quadraticCurveTo(this.x + 70 * this.facing, this.y - 30, this.x + 40 * this.facing, this.y - 15);
             ctx.stroke();
             // Restore style
             ctx.strokeStyle = this.color;
             ctx.lineWidth = 4;
        }

        // Jambes
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - 15, this.y + 30);
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + 15, this.y + 30);
        ctx.stroke();

        // Shield Visual
        if (this.hasShield) {
            ctx.beginPath();
            ctx.strokeStyle = "#00FFFF";
            ctx.lineWidth = 3;
            ctx.arc(this.x, this.y - 35, 50, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0; // Reset alpha
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.y < GROUND) this.vy += GRAVITY;
        else {
            this.y = GROUND;
            this.vy = 0;
        }

        this.x = Math.max(20, Math.min(canvas.width - 20, this.x));

        // Body Collision with PowerBlock (Collect by touch)
        if (powerBlock.active) {
             const dx = Math.abs(this.x - (powerBlock.x + 20));
             const dy = Math.abs((this.y - 40) - (powerBlock.y + 20));

             if (dx < 40 && dy < 60) {
                 powerBlock.active = false;
                 this.collectPower(powerBlock.type);
             }
        }

        // Body Collision with PistolDrop
        if (pistolDrop.active) {
            // Pistol is at pistolDrop.x, pistolDrop.y - 20 (drawn there)
            // But logic coordinates: y is ground.
            const dx = Math.abs(this.x - (pistolDrop.x + 10)); // +10 center
            const dy = Math.abs(this.y - pistolDrop.y);

            if (dx < 40 && dy < 60) {
                pistolDrop.active = false;
                this.hasPistol = true;
                this.ammo = 6;
            }
        }
    }

    attack(target, type = "light") {
        // Prevent attack if already attacking OR if invincible OR if on cooldown
        if (!this.attacking && !this.invincible && !this.attackCooldown) {
            this.attacking = true;
            this.attackCooldown = true;

            // PISTOL SHOOTING
            if (this.hasPistol && this.ammo > 0) {
                this.ammo--;
                // Spawn Bullet
                bullets.push(new Bullet(
                    this.x + 60 * this.facing, // Start at gun tip
                    this.y - 40,
                    15 * this.facing, // High speed
                    this.color,
                    this // Owner
                ));

                if (this.ammo <= 0) this.hasPistol = false;

                // Quick cooldown for shooting
                setTimeout(() => this.attacking = false, 100);
                setTimeout(() => this.attackCooldown = false, 300);
                return;
            }

            // --- MELEE ATTACK ---

            // Check collision with PowerBlock (Attack range)
            if (powerBlock.active) {
                const dx = Math.abs(this.x - (powerBlock.x + powerBlock.width/2));
                const dy = Math.abs((this.y - 40) - (powerBlock.y + powerBlock.height/2));

                const directionToBlock = (powerBlock.x + 20) - this.x;
                const facingCorrect = (directionToBlock * this.facing) > 0;

                if (dx < 80 && dy < 120 && facingCorrect) {
                    powerBlock.active = false;
                    this.collectPower(powerBlock.type);
                }
            }

            let damage = 10;
            if (type === "light") damage = 5;
            if (type === "heavy") damage = 15;

            if (this.hasPower) damage *= 2; // Double damage

            // Only calculate hit if target is not invincible
            if (!target.invincible) {
                const hit = Math.abs(this.x - target.x) < 50;
                if (hit) {
                    // Check Shield
                    if (target.hasShield) {
                        target.hasShield = false; // Break shield
                        shake = 5; // Minor shake for impact
                        freezeFrames = 2;
                    } else {
                        target.health -= damage;
                        freezeFrames = 6;
                        shake = 10;

                        // Apply hit effects: invincible and disable attack
                        target.invincible = true;
                        target.attacking = false; // Interrupt attack
                        setTimeout(() => target.invincible = false, 2000);
                    }
                }
            }
            // Attack duration 200ms
            setTimeout(() => this.attacking = false, 200);
            // Cooldown 400ms
            setTimeout(() => this.attackCooldown = false, 400);
        }
    }
}

const keys = {};

document.addEventListener("keydown", e => {
    // Prevent default browser actions for game keys to avoid scrolling etc.
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"," "].indexOf(e.code) > -1) {
        e.preventDefault();
    }
    keys[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const p1 = new Fighter(300, "#00ffff", {
    left: "q",
    right: "d",
    jump: "z",
    attackLight: "e",
    attackHeavy: "r"
});

const p2 = new Fighter(700, "#ff00ff", {
    left: "ArrowLeft",
    right: "ArrowRight",
    jump: "ArrowUp",
    attackLight: "Enter",
    attackHeavy: "Shift"
});

// Set initial facing for P2
p2.facing = -1;

function handleInput(p, enemy) {
    p.vx = 0;

    if (keys[p.controls.left.toLowerCase()]) {
        p.vx = -4;
        p.facing = -1;
    }
    if (keys[p.controls.right.toLowerCase()]) {
        p.vx = 4;
        p.facing = 1;
    }
    if (keys[p.controls.jump.toLowerCase()] && p.vy === 0) {
        p.vy = -12;
    }
    if (keys[p.controls.attackLight.toLowerCase()]) {
        p.attack(enemy, "light");
    }
    if (keys[p.controls.attackHeavy.toLowerCase()]) {
        p.attack(enemy, "heavy");
    }
}

function drawGround() {
    ctx.strokeStyle = "#00ffff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(0, GROUND + 30);
    ctx.lineTo(canvas.width, GROUND + 30);
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function updateUI() {
    document.getElementById("hp1").style.width = Math.max(0, p1.health) + "%";
    document.getElementById("hp2").style.width = Math.max(0, p2.health) + "%";
}

function resetGame() {
    p1.reset();
    p2.reset();
    powerBlock.reset();
    pistolDrop.reset();
    bullets = [];
    freezeFrames = 0;
    shake = 0;
    updateUI();
}

function checkGameOver() {
    if (p1.health <= 0 || p2.health <= 0) {
        gameState = "GAMEOVER";
        uiDiv.classList.add("hidden");
        gameOverScreen.classList.remove("hidden");

        if (p1.health <= 0 && p2.health <= 0) {
            winnerText.innerText = "DRAW!";
            winnerText.style.color = "white";
        } else if (p1.health <= 0) {
            winnerText.innerText = "PLAYER 2 WINS!";
            winnerText.style.color = p2.color;
        } else {
            winnerText.innerText = "PLAYER 1 WINS!";
            winnerText.style.color = p1.color;
        }
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.update();
        b.draw();

        if (!b.active) {
            bullets.splice(i, 1);
            continue;
        }

        // Check collision with enemy
        let target = b.owner === p1 ? p2 : p1;

        // Simple hit box (Target X +/- 20, Y 0 to -80)
        // Bullet is point
        if (b.x > target.x - 20 && b.x < target.x + 20 &&
            b.y > target.y - 80 && b.y < target.y) {

            b.active = false;

            if (target.hasShield) {
                target.hasShield = false;
                shake = 5;
            } else if (!target.invincible) {
                target.health -= 20; // Pistol Damage
                shake = 5;
                target.invincible = true;
                setTimeout(() => target.invincible = false, 1000); // Shorter iframe for shots
            }
        }
    }
}

function gameLoop() {
    // Reset transform to clear properly
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "MENU") {
        drawGround();
        // Draw static fighters as preview
        p1.draw();
        p2.draw();
    }
    else if (gameState === "PLAYING") {
        // Shake effect
        if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
            shake *= 0.9;
            if (shake < 0.5) shake = 0;
        }

        if (freezeFrames > 0) {
            freezeFrames--;
        } else {
            powerBlock.update();
            pistolDrop.update();
            handleInput(p1, p2);
            handleInput(p2, p1);
            p1.update();
            p2.update();
            updateBullets();
        }

        drawGround();
        powerBlock.draw();
        pistolDrop.draw();
        p1.draw();
        p2.draw();
        updateUI();
        checkGameOver();
    }
    else if (gameState === "GAMEOVER") {
        // Just draw the last frame state (static) without updates
        drawGround();
        powerBlock.draw();
        p1.draw();
        p2.draw();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
