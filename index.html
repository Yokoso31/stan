<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pong Neon</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: black;
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(0,0,0,0.85);
        font-size: 48px;
        text-align: center;
        text-shadow: 0 0 20px white;
        display: none;
    }

    .overlay small {
        font-size: 20px;
        margin-top: 20px;
        opacity: 0.7;
    }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<div id="overlay" class="overlay">
    <div id="result"></div>
    <small>Appuyez sur ESPACE pour rejouer</small>
</div>

<script>
/* ==========================
   INITIALISATION
========================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const resultText = document.getElementById("result");

const paddleWidth = 12;
const paddleHeight = 90;
const ballSize = 10;
const winScore = 5;

/* ==========================
   ÉTAT DU JEU
========================== */
let gameRunning = false;
let gameOver = false;

let player = {
    x: 20,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let ai = {
    x: canvas.width - 32,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 4
};

let ball = resetBall();

/* ==========================
   CONTROLES
========================== */
let keys = {};

document.addEventListener("keydown", e => {
    keys[e.code] = true;

    if (e.code === "Space") {
        if (!gameRunning && !gameOver) gameRunning = true;
        if (gameOver) restartGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

/* ==========================
   LOGIQUE
========================== */
function resetBall(direction = 1) {
    return {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 6 * direction,
        vy: (Math.random() * 4 - 2)
    };
}

function restartGame() {
    player.score = 0;
    ai.score = 0;
    gameOver = false;
    gameRunning = false;
    overlay.style.display = "none";
    ball = resetBall();
}

function update() {
    if (!gameRunning || gameOver) return;

    // Joueur
    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;
    player.y = Math.max(0, Math.min(canvas.height - paddleHeight, player.y));

    // IA
    const aiCenter = ai.y + paddleHeight / 2;
    if (aiCenter < ball.y - 10) ai.y += ai.speed;
    if (aiCenter > ball.y + 10) ai.y -= ai.speed;

    // Balle
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0 || ball.y >= canvas.height) ball.vy *= -1;

    // Collision raquettes
    if (collision(player)) ball.vx = Math.abs(ball.vx);
    if (collision(ai)) ball.vx = -Math.abs(ball.vx);

    // Score
    if (ball.x < 0) score(ai);
    if (ball.x > canvas.width) score(player);
}

function collision(p) {
    return (
        ball.x - ballSize < p.x + paddleWidth &&
        ball.x + ballSize > p.x &&
        ball.y > p.y &&
        ball.y < p.y + paddleHeight
    );
}

function score(who) {
    who.score++;
    if (who.score >= winScore) endGame(who === player);
    ball = resetBall(who === ai ? -1 : 1);
    gameRunning = false;
}

function endGame(playerWon) {
    gameOver = true;
    overlay.style.display = "flex";
    resultText.textContent = playerWon ? "YOU WIN" : "YOU LOSE";
}

/* ==========================
   RENDU
========================== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.shadowColor = "white";
    ctx.shadowBlur = 15;

    // Raquettes
    ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);
    ctx.fillRect(ai.x, ai.y, paddleWidth, paddleHeight);

    // Balle
    ctx.fillRect(ball.x - ballSize / 2, ball.y - ballSize / 2, ballSize, ballSize);

    // Scores
    ctx.shadowBlur = 0;
    ctx.font = "32px Arial";
    ctx.fillText(player.score, canvas.width / 4, 40);
    ctx.fillText(ai.score, canvas.width * 3 / 4, 40);

    // Ligne centrale
    ctx.setLineDash([10, 15]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.strokeStyle = "white";
    ctx.stroke();
}

/* ==========================
   BOUCLE PRINCIPALE
========================== */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
