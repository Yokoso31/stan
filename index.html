<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pong Neon</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: black;
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(0,0,0,0.85);
        font-size: 48px;
        text-align: center;
        text-shadow: 0 0 20px white;
    }

    .overlay small {
        font-size: 20px;
        margin-top: 20px;
        opacity: 0.7;
    }

    .controls {
        font-size: 24px;
        margin-top: 30px;
        line-height: 1.5;
        color: #ddd;
        text-shadow: none;
    }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<div id="overlay" class="overlay">
    <div id="result">PONG NEON</div>

    <div class="controls">
        <div><strong>Joueur 1</strong> : Z (Haut) / S (Bas)</div>
        <div><strong>Joueur 2</strong> : P (Haut) / M (Bas)</div>
    </div>

    <small>Appuyez sur ESPACE pour jouer</small>
</div>

<script>
/* ==========================
   INITIALISATION
========================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const resultText = document.getElementById("result");

const paddleWidth = 12;
const paddleHeight = 90;
const ballSize = 10;
const winScore = 5;

/* ==========================
   ÉTAT DU JEU
========================== */
let gameRunning = false;
let gameOver = false;

let player1 = {
    x: 20,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let player2 = {
    x: canvas.width - 32,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let ball = resetBall();

/* ==========================
   CONTROLES
========================== */
let keys = {};

document.addEventListener("keydown", e => {
    keys[e.key] = true;

    if (e.code === "Space") {
        if (!gameRunning && !gameOver) {
            gameRunning = true;
            overlay.style.display = "none";
        }
        if (gameOver) restartGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

/* ==========================
   LOGIQUE
========================== */
function resetBall(direction = 1) {
    return {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 6 * direction,
        vy: (Math.random() * 4 - 2)
    };
}

function restartGame() {
    player1.score = 0;
    player2.score = 0;
    gameOver = false;
    gameRunning = true;
    overlay.style.display = "none";
    ball = resetBall();
}

function update() {
    if (!gameRunning || gameOver) return;

    // Joueur 1 (Z/S)
    if (keys["z"] || keys["Z"]) player1.y -= player1.speed;
    if (keys["s"] || keys["S"]) player1.y += player1.speed;
    player1.y = Math.max(0, Math.min(canvas.height - paddleHeight, player1.y));

    // Joueur 2 (P/M)
    if (keys["p"] || keys["P"]) player2.y -= player2.speed;
    if (keys["m"] || keys["M"]) player2.y += player2.speed;
    player2.y = Math.max(0, Math.min(canvas.height - paddleHeight, player2.y));

    // Balle
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0 || ball.y >= canvas.height) ball.vy *= -1;

    // Collision raquettes
    if (collision(player1)) ball.vx = Math.abs(ball.vx);
    if (collision(player2)) ball.vx = -Math.abs(ball.vx);

    // Score
    if (ball.x < 0) score(player2);
    if (ball.x > canvas.width) score(player1);
}

function collision(p) {
    return (
        ball.x - ballSize < p.x + paddleWidth &&
        ball.x + ballSize > p.x &&
        ball.y > p.y &&
        ball.y < p.y + paddleHeight
    );
}

function score(who) {
    who.score++;
    if (who.score >= winScore) endGame(who === player1);
    ball = resetBall(who === player2 ? -1 : 1);
    gameRunning = false;
}

function endGame(player1Won) {
    gameOver = true;
    overlay.style.display = "flex";
    resultText.textContent = player1Won ? "JOUEUR 1 GAGNE" : "JOUEUR 2 GAGNE";
}

/* ==========================
   RENDU
========================== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.shadowColor = "white";
    ctx.shadowBlur = 15;

    // Raquettes
    ctx.fillRect(player1.x, player1.y, paddleWidth, paddleHeight);
    ctx.fillRect(player2.x, player2.y, paddleWidth, paddleHeight);

    // Balle
    ctx.fillRect(ball.x - ballSize / 2, ball.y - ballSize / 2, ballSize, ballSize);

    // Scores
    ctx.shadowBlur = 0;
    ctx.font = "32px Arial";
    ctx.fillText(player1.score, canvas.width / 4, 40);
    ctx.fillText(player2.score, canvas.width * 3 / 4, 40);

    // Ligne centrale
    ctx.setLineDash([10, 15]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.strokeStyle = "white";
    ctx.stroke();
}

/* ==========================
   BOUCLE PRINCIPALE
========================== */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
