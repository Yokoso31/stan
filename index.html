<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fortnite Pong</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        font-family: 'Luckiest Guy', cursive;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: linear-gradient(to bottom, #1b0033, #3a0066);
        border: 4px solid #9d4dbb;
        box-shadow: 0 0 20px #9d4dbb;
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(27, 0, 51, 0.9);
        font-size: 64px;
        text-align: center;
        text-shadow: 2px 2px 0px black;
        color: #f7ea00;
        letter-spacing: 2px;
    }

    .overlay small {
        font-size: 24px;
        margin-top: 20px;
        color: white;
        text-shadow: 1px 1px 0px black;
    }

    .controls {
        font-size: 28px;
        margin-top: 30px;
        line-height: 1.5;
        color: white;
        text-shadow: 2px 2px 0px black;
    }

    #menu {
        margin: 30px 0;
        display: flex;
        gap: 30px;
    }

    .btn {
        background: #f7ea00;
        border: none;
        color: black;
        font-size: 32px;
        padding: 15px 40px;
        cursor: pointer;
        font-family: 'Luckiest Guy', cursive;
        text-transform: uppercase;
        transform: skew(-10deg);
        box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        transition: all 0.1s;
    }

    .btn:hover {
        transform: skew(-10deg) scale(1.05);
        background: #fff;
    }

    .btn:active {
        transform: skew(-10deg) scale(0.95);
    }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<div id="overlay" class="overlay">
    <div id="result">FORTNITE PONG</div>

    <div id="menu">
        <button id="btn-play" class="btn">JOUER</button>
        <button id="btn-ball" class="btn">BALLE</button>
    </div>

    <div class="controls">
        <div><strong>Joueur 1</strong> : Z (Haut) / S (Bas)</div>
        <div><strong>Joueur 2</strong> : P (Haut) / M (Bas)</div>
    </div>

    <small>Ou appuyez sur ESPACE</small>
</div>

<script>
/* ==========================
   INITIALISATION
========================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const resultText = document.getElementById("result");
const btnPlay = document.getElementById("btn-play");
const btnBall = document.getElementById("btn-ball");

const paddleWidth = 15;
const paddleHeight = 90;
const ballSize = 12;
const winScore = 5;

/* ==========================
   ÉTAT DU JEU
========================== */
let gameRunning = false;
let gameOver = false;
let ballColor = "#f7ea00"; // Default Fortnite Gold
let secretMode = false;
let keySequence = [];

let player1 = {
    x: 20,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let player2 = {
    x: canvas.width - 32,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let ball = resetBall();

/* ==========================
   CONTROLES
========================== */
let keys = {};

document.addEventListener("keydown", e => {
    keys[e.key] = true;

    if (e.code === "Space") {
        startGame();
    }

    // Cheat detection (Shift + A Z E)
    if (!gameRunning) {
        if (e.key === "A" || e.key === "Z" || e.key === "E") {
             keySequence.push(e.key);
             if (keySequence.length > 3) keySequence.shift();

             if (keySequence.join("") === "AZE") {
                 secretMode = !secretMode;
                 if (secretMode) {
                     resultText.textContent = "SECRET MODE ACTIVATED";
                     resultText.style.color = "#ff00ff";
                 } else {
                     resultText.textContent = "FORTNITE PONG";
                     resultText.style.color = "#f7ea00";
                 }
                 keySequence = [];
             }
        } else if (e.key.length === 1) {
             keySequence = [];
        }
    }
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

btnPlay.addEventListener("click", () => {
    startGame();
});

btnBall.addEventListener("click", () => {
    const colors = ["#f7ea00", "#00d4ff", "#bd00ff", "#ff7b00", "#ffffff"]; // Gold, Blue, Purple, Orange, White
    let currentIndex = colors.indexOf(ballColor);
    if(currentIndex === -1) currentIndex = 0;
    ballColor = colors[(currentIndex + 1) % colors.length];

    // Feedback
    btnBall.style.background = ballColor;
    if (ballColor === "#ffffff" || ballColor === "#f7ea00") {
        btnBall.style.color = "black";
    } else {
        btnBall.style.color = "white";
    }
});

/* ==========================
   LOGIQUE
========================== */
function startGame() {
    if (!gameRunning && !gameOver) {
        gameRunning = true;
        overlay.style.display = "none";
    }
    if (gameOver) restartGame();
}

function resetBall(direction = 1) {
    return {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 6 * direction,
        vy: (Math.random() * 4 - 2)
    };
}

function restartGame() {
    player1.score = 0;
    player2.score = 0;
    gameOver = false;
    gameRunning = true;
    overlay.style.display = "none";
    ball = resetBall();
}

function update() {
    if (!gameRunning || gameOver) return;

    // Joueur 1 (Z/S)
    if (keys["z"] || keys["Z"]) player1.y -= player1.speed;
    if (keys["s"] || keys["S"]) player1.y += player1.speed;
    player1.y = Math.max(0, Math.min(canvas.height - paddleHeight, player1.y));

    // Joueur 2 (P/M)
    if (keys["p"] || keys["P"]) player2.y -= player2.speed;
    if (keys["m"] || keys["M"]) player2.y += player2.speed;
    player2.y = Math.max(0, Math.min(canvas.height - paddleHeight, player2.y));

    // Balle
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0 || ball.y >= canvas.height) {
        if (secretMode) {
             ball.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 6 + 2);
             if (ball.y <= 0) ball.vy = Math.abs(ball.vy);
             else ball.vy = -Math.abs(ball.vy);
        } else {
             ball.vy *= -1;
        }
    }

    // Collision raquettes
    checkPaddleCollision(player1);
    checkPaddleCollision(player2);

    // Cap max speed
    if (ball.vx > 20) ball.vx = 20;
    if (ball.vx < -20) ball.vx = -20;

    // Score
    if (ball.x < 0) score(player2);
    if (ball.x > canvas.width) score(player1);
}

function checkPaddleCollision(p) {
    let bLeft = ball.x - ballSize / 2;
    let bRight = ball.x + ballSize / 2;
    let bTop = ball.y - ballSize / 2;
    let bBottom = ball.y + ballSize / 2;

    let pLeft = p.x;
    let pRight = p.x + paddleWidth;
    let pTop = p.y;
    let pBottom = p.y + paddleHeight;

    if (bLeft < pRight && bRight > pLeft && bTop < pBottom && bBottom > pTop) {
        let overlapLeft = bRight - pLeft;
        let overlapRight = pRight - bLeft;
        let overlapTop = bBottom - pTop;
        let overlapBottom = pBottom - bTop;

        let minOverlapX = Math.min(overlapLeft, overlapRight);
        let minOverlapY = Math.min(overlapTop, overlapBottom);

        if (minOverlapX < minOverlapY) {
            // Horizontal Collision (Front Face)
            if (overlapLeft < overlapRight) {
                 ball.x = pLeft - ballSize / 2;
            } else {
                 ball.x = pRight + ballSize / 2;
            }
            ball.vx = -ball.vx;
            ball.vx *= 1.05;
            if (secretMode) randomizeBounce();
        } else {
            // Vertical Collision (Top/Bottom Edge)
            if (overlapTop < overlapBottom) {
                ball.y = pTop - ballSize / 2;
            } else {
                ball.y = pBottom + ballSize / 2;
            }
            ball.vy = -ball.vy;
        }
    }
}

function randomizeBounce() {
    ball.vy = (Math.random() * 10 - 5);
    let sign = ball.vx > 0 ? 1 : -1;
    let speed = Math.abs(ball.vx);
    ball.vx = sign * (speed + (Math.random() * 2 - 1));
}

function score(who) {
    who.score++;
    if (who.score >= winScore) endGame(who === player1);
    ball = resetBall(who === player2 ? -1 : 1);
    gameRunning = false;
}

function endGame(player1Won) {
    gameOver = true;
    overlay.style.display = "flex";
    resultText.textContent = player1Won ? "#1 VICTOIRE ROYALE" : "#1 VICTOIRE ROYALE";
    // Usually "Victory Royale" is shown to the winner. Since this is local, we can say "P1 WINS" but styled as "VICTORY ROYALE"
    // Let's customize per player
    if (player1Won) resultText.textContent = "JOUEUR 1 - VICTOIRE ROYALE";
    else resultText.textContent = "JOUEUR 2 - VICTOIRE ROYALE";

    resultText.style.color = "#f7ea00";
}

/* ==========================
   RENDU
========================== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.shadowBlur = 10;

    // Raquettes (Cyan/Shield Blue)
    ctx.fillStyle = "#00d4ff";
    ctx.shadowColor = "#00d4ff";
    ctx.fillRect(player1.x, player1.y, paddleWidth, paddleHeight);

    // Player 2 Red/Purple
    ctx.fillStyle = "#bd00ff";
    ctx.shadowColor = "#bd00ff";
    ctx.fillRect(player2.x, player2.y, paddleWidth, paddleHeight);

    // Balle
    if (secretMode) {
        const hue = (Date.now() / 5) % 360;
        ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
    } else {
        ctx.fillStyle = ballColor;
        ctx.shadowColor = ballColor;
    }
    // Draw ball as circle
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ballSize/2, 0, Math.PI * 2);
    ctx.fill();

    // Scores
    ctx.fillStyle = "white";
    ctx.shadowColor = "black";
    ctx.shadowBlur = 0;
    ctx.font = "48px 'Luckiest Guy'";
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;

    ctx.strokeText(player1.score, canvas.width / 4, 60);
    ctx.fillText(player1.score, canvas.width / 4, 60);

    ctx.strokeText(player2.score, canvas.width * 3 / 4, 60);
    ctx.fillText(player2.score, canvas.width * 3 / 4, 60);

    // Ligne centrale
    ctx.setLineDash([15, 20]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 4;
    ctx.stroke();
}

/* ==========================
   BOUCLE PRINCIPALE
========================== */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
