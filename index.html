<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dino Game HTML5</title>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #game {
            position: relative;
            width: 600px;
            height: 200px;
            border-bottom: 4px solid #333;
            background: white;
            overflow: hidden;
        }

        #dino {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 5px;
        }

        .obstacle {
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 40px;
            background: #2ecc71;
        }

        #score {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 18px;
            color: #333;
        }

        #gameOver {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            display: none;
        }

        #gameOver button {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game">
    <div id="dino"></div>
    <div id="score">Score: 0</div>

    <div id="gameOver">
        <div>Game Over</div>
        <button onclick="restart()">Rejouer</button>
    </div>
</div>

<script>
    /* ÉLÉMENTS */
    const dino = document.getElementById("dino");
    const game = document.getElementById("game");
    const scoreDisplay = document.getElementById("score");
    const gameOverScreen = document.getElementById("gameOver");

    /* PHYSIQUE */
    let isJumping = false;
    let velocity = 0;
    const gravity = 0.6;

    /* JEU */
    let obstacles = [];
    let score = 0;
    let speed = 5;
    let gameRunning = true;

    /* SAUT */
    function jump() {
        if (!isJumping) {
            velocity = 12;
            isJumping = true;
        }
    }

    document.addEventListener("keydown", e => {
        if (e.code === "Space") jump();
    });

    document.addEventListener("click", jump);

    /* OBSTACLES */
    function createObstacle() {
        const obstacle = document.createElement("div");
        obstacle.classList.add("obstacle");
        obstacle.style.left = game.offsetWidth + "px";
        game.appendChild(obstacle);
        obstacles.push(obstacle);

        setTimeout(createObstacle, Math.random() * 1500 + 800);
    }

    /* COLLISION */
    function isColliding(a, b) {
        const r1 = a.getBoundingClientRect();
        const r2 = b.getBoundingClientRect();
        return !(
            r1.top > r2.bottom ||
            r1.bottom < r2.top ||
            r1.right < r2.left ||
            r1.left > r2.right
        );
    }

    /* BOUCLE DE JEU */
    function gameLoop() {
        if (!gameRunning) return;

        // Physique du saut
        velocity -= gravity;
        let bottom = parseFloat(getComputedStyle(dino).bottom);
        bottom += velocity;

        if (bottom <= 0) {
            bottom = 0;
            isJumping = false;
        }

        dino.style.bottom = bottom + "px";

        // Obstacles
        obstacles.forEach((obs, index) => {
            let left = parseFloat(obs.style.left);
            left -= speed;
            obs.style.left = left + "px";

            if (left < -20) {
                obs.remove();
                obstacles.splice(index, 1);
                score++;
                scoreDisplay.textContent = "Score: " + score;
            }

            if (isColliding(dino, obs)) {
                endGame();
            }
        });

        requestAnimationFrame(gameLoop);
    }

    /* FIN DU JEU */
    function endGame() {
        gameRunning = false;
        gameOverScreen.style.display = "flex";
    }

    /* RESTART */
    function restart() {
        obstacles.forEach(o => o.remove());
        obstacles = [];
        score = 0;
        speed = 5;
        gameRunning = true;
        gameOverScreen.style.display = "none";
        scoreDisplay.textContent = "Score: 0";
        requestAnimationFrame(gameLoop);
    }

    /* LANCEMENT */
    createObstacle();
    requestAnimationFrame(gameLoop);
</script>

</body>
</html>
