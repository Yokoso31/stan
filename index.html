<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pong Neon</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: black;
        border: 4px solid white;
        box-shadow: 0 0 20px white;
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(0,0,0,0.85);
        font-size: 48px;
        text-align: center;
        text-shadow: 0 0 20px white;
    }

    .overlay small {
        font-size: 20px;
        margin-top: 20px;
        opacity: 0.7;
    }

    .controls {
        font-size: 24px;
        margin-top: 30px;
        line-height: 1.5;
        color: #ddd;
        text-shadow: none;
    }

    #menu {
        margin: 20px 0;
        display: flex;
        gap: 20px;
    }

    .btn {
        background: transparent;
        border: 2px solid white;
        color: white;
        font-size: 24px;
        padding: 10px 30px;
        cursor: pointer;
        font-family: Arial, sans-serif;
        text-transform: uppercase;
        box-shadow: 0 0 10px white;
        transition: all 0.2s;
    }

    .btn:hover {
        background: white;
        color: black;
        box-shadow: 0 0 20px white;
    }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<div id="overlay" class="overlay">
    <div id="result">PONG NEON</div>

    <div id="menu">
        <button id="btn-play" class="btn">JOUER</button>
        <button id="btn-ball" class="btn">BALLE</button>
    </div>

    <div class="controls">
        <div><strong>Joueur 1</strong> : Z (Haut) / S (Bas)</div>
        <div><strong>Joueur 2</strong> : P (Haut) / M (Bas)</div>
    </div>

    <small>Ou appuyez sur ESPACE</small>
</div>

<script>
/* ==========================
   INITIALISATION
========================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const resultText = document.getElementById("result");
const btnPlay = document.getElementById("btn-play");
const btnBall = document.getElementById("btn-ball");

const paddleWidth = 12;
const paddleHeight = 90;
const ballSize = 10;
const winScore = 5;

/* ==========================
   ÉTAT DU JEU
========================== */
let gameRunning = false;
let gameOver = false;
let ballColor = "white";
let secretMode = false;
let keySequence = [];

let player1 = {
    x: 20,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let player2 = {
    x: canvas.width - 32,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let ball = resetBall();

/* ==========================
   CONTROLES
========================== */
let keys = {};

document.addEventListener("keydown", e => {
    keys[e.key] = true;

    if (e.code === "Space") {
        startGame();
    }

    // Cheat detection (Shift + A Z E)
    // We store the last 3 keys
    if (!gameRunning) {
        if (e.key === "A" || e.key === "Z" || e.key === "E") {
             keySequence.push(e.key);
             if (keySequence.length > 3) keySequence.shift();

             // Check for A, Z, E
             if (keySequence.join("") === "AZE") {
                 secretMode = !secretMode;
                 if (secretMode) {
                     resultText.textContent = "SECRET MODE ACTIVATED";
                     resultText.style.color = "#ff00ff";
                     resultText.style.textShadow = "0 0 20px #ff00ff";
                 } else {
                     resultText.textContent = "PONG NEON";
                     resultText.style.color = "white";
                     resultText.style.textShadow = "0 0 20px white";
                 }
                 keySequence = []; // Reset
             }
        } else if (e.key.length === 1) {
            // Reset if other key pressed (ignoring Shift/Ctrl etc which often have length > 1 or specific codes)
             keySequence = [];
        }
    }
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

btnPlay.addEventListener("click", () => {
    startGame();
});

btnBall.addEventListener("click", () => {
    // Cycle colors
    const colors = ["white", "#ff0055", "#00ff55", "#0055ff", "#ffff00"];
    let currentIndex = colors.indexOf(ballColor);
    ballColor = colors[(currentIndex + 1) % colors.length];

    // Visual feedback
    btnBall.style.boxShadow = `0 0 10px ${ballColor}`;
    btnBall.style.borderColor = ballColor;
    if (ballColor === "white") {
        btnBall.style.color = "white";
    } else {
        btnBall.style.color = ballColor;
    }
});

/* ==========================
   LOGIQUE
========================== */
function startGame() {
    if (!gameRunning && !gameOver) {
        gameRunning = true;
        overlay.style.display = "none";
    }
    if (gameOver) restartGame();
}

function resetBall(direction = 1) {
    return {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 6 * direction,
        vy: (Math.random() * 4 - 2)
    };
}

function restartGame() {
    player1.score = 0;
    player2.score = 0;
    gameOver = false;
    gameRunning = true;
    overlay.style.display = "none";
    ball = resetBall();
}

function update() {
    if (!gameRunning || gameOver) return;

    // Joueur 1 (Z/S)
    if (keys["z"] || keys["Z"]) player1.y -= player1.speed;
    if (keys["s"] || keys["S"]) player1.y += player1.speed;
    player1.y = Math.max(0, Math.min(canvas.height - paddleHeight, player1.y));

    // Joueur 2 (P/M)
    if (keys["p"] || keys["P"]) player2.y -= player2.speed;
    if (keys["m"] || keys["M"]) player2.y += player2.speed;
    player2.y = Math.max(0, Math.min(canvas.height - paddleHeight, player2.y));

    // Balle
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0 || ball.y >= canvas.height) {
        if (secretMode) {
             // Random bounce off walls
             ball.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 6 + 2);
             // Ensure it moves away from wall
             if (ball.y <= 0) ball.vy = Math.abs(ball.vy);
             else ball.vy = -Math.abs(ball.vy);
        } else {
             ball.vy *= -1;
        }
    }

    // Collision raquettes
    if (collision(player1)) {
        ball.vx = Math.abs(ball.vx) * 1.05; // Accélération
        if (secretMode) randomizeBounce();
    }
    if (collision(player2)) {
        ball.vx = -Math.abs(ball.vx) * 1.05; // Accélération
        if (secretMode) randomizeBounce();
    }

    // Cap max speed to avoid breaking physics (pass through paddles)
    if (ball.vx > 20) ball.vx = 20;
    if (ball.vx < -20) ball.vx = -20;

    // Score
    if (ball.x < 0) score(player2);
    if (ball.x > canvas.width) score(player1);
}

function randomizeBounce() {
    // Randomize vertical speed significantly
    ball.vy = (Math.random() * 10 - 5);
    // In secret mode, we still respect the accelerated direction but randomize magnitude a bit more
    // ball.vx is already set to accelerate direction in update(), but we can add chaos here
    let sign = ball.vx > 0 ? 1 : -1;
    let speed = Math.abs(ball.vx);
    ball.vx = sign * (speed + (Math.random() * 2 - 1));
}

function collision(p) {
    return (
        ball.x - ballSize < p.x + paddleWidth &&
        ball.x + ballSize > p.x &&
        ball.y > p.y &&
        ball.y < p.y + paddleHeight
    );
}

function score(who) {
    who.score++;
    if (who.score >= winScore) endGame(who === player1);
    ball = resetBall(who === player2 ? -1 : 1);
    gameRunning = false;
}

function endGame(player1Won) {
    gameOver = true;
    overlay.style.display = "flex";
    resultText.textContent = player1Won ? "JOUEUR 1 GAGNE" : "JOUEUR 2 GAGNE";

    // Reset secret visual text if game over
    resultText.style.color = "white";
    resultText.style.textShadow = "0 0 20px white";
}

/* ==========================
   RENDU
========================== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.shadowBlur = 15;

    // Raquettes (always white for now)
    ctx.fillStyle = "white";
    ctx.shadowColor = "white";
    ctx.fillRect(player1.x, player1.y, paddleWidth, paddleHeight);
    ctx.fillRect(player2.x, player2.y, paddleWidth, paddleHeight);

    // Balle (use selected color)
    if (secretMode) {
        const hue = (Date.now() / 5) % 360;
        ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
    } else {
        ctx.fillStyle = ballColor;
        ctx.shadowColor = ballColor;
    }
    ctx.fillRect(ball.x - ballSize / 2, ball.y - ballSize / 2, ballSize, ballSize);

    // Scores
    ctx.fillStyle = "white";
    ctx.shadowColor = "white";
    ctx.shadowBlur = 0;
    ctx.font = "32px Arial";
    ctx.fillText(player1.score, canvas.width / 4, 40);
    ctx.fillText(player2.score, canvas.width * 3 / 4, 40);

    // Ligne centrale
    ctx.setLineDash([10, 15]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.strokeStyle = "white";
    ctx.stroke();
}

/* ==========================
   BOUCLE PRINCIPALE
========================== */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
