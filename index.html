<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Horror Space Invaders</title>
<style>
    html, body {
        margin: 0;
        background: radial-gradient(circle at center, #200000, #000);
        overflow: hidden;
        font-family: 'Courier New', monospace;
        color: #ff3333;
    }

    canvas {
        display: block;
        margin: auto;
    }

    #ui {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        font-size: 20px;
        text-shadow: 0 0 10px #ff0000;
        font-weight: bold;
    }

    #gameOver {
        position: absolute;
        inset: 0;
        display: none;
        background: rgba(0,0,0,0.9);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ff0000;
        text-shadow: 0 0 20px #ff0000;
    }

    #gameOver h1 {
        font-size: 60px;
        margin-bottom: 20px;
        border-bottom: 2px solid #ff0000;
    }

    #gameOver button {
        margin-top: 20px;
        padding: 12px 30px;
        font-size: 20px;
        font-family: 'Courier New', monospace;
        cursor: pointer;
        background: #110000;
        color: #ff3333;
        border: 2px solid #ff3333;
        box-shadow: 0 0 15px #ff0000;
        transition: 0.3s;
    }

    #gameOver button:hover {
        background: #ff3333;
        color: black;
    }
</style>
</head>

<body>

<div id="ui">Score: <span id="score">0</span> | Vies: <span id="lives">3</span> | Niveau: <span id="level">1</span></div>

<div id="gameOver">
    <h1>VOUS ÊTES MORT</h1>
    <button onclick="restart()">RÉINCARNER</button>
</div>

<canvas id="game" width="800" height="600"></canvas>

<script>
/* ==========================
   SETUP
========================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 3;
let level = 1;
let gameRunning = true;

/* ==========================
   INPUT
========================== */
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

/* ==========================
   PLAYER
========================== */
const player = {
    x: 400,
    y: 540,
    width: 40,
    height: 20,
    speed: 6
};

let bullets = [];
let alienBullets = []; // Projectiles ennemis

/* ==========================
   ALIENS
========================== */
let aliens = [];
const rows = 4;
const cols = 8;
let alienDirection = 1; // 1 = right, -1 = left
let alienSpeed = 2;

function initAliens() {
    aliens = [];
    alienBullets = [];
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            aliens.push({
                x: 100 + x * 70,
                y: 80 + y * 60,
                size: 25,
                angle: 0 // utilisé pour la rotation
            });
        }
    }
}

initAliens();

/* ==========================
   PARTICULES (EXPLOSIONS)
   Chaque particule a une vitesse, une durée de vie et une couleur
========================== */
const particles = [];

function createExplosion(x, y) {
    for (let i = 0; i < 25; i++) {
        particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 40,
            color: Math.random() > 0.5 ? "#ff0000" : "#880000" // Blood colors
        });
    }
}

/* ==========================
   GAME LOOP
========================== */
function update() {
    if (!gameRunning) return;

    // Mouvement joueur
    if (keys["ArrowLeft"]) player.x -= player.speed;
    if (keys["ArrowRight"]) player.x += player.speed;
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

    // Tir
    if (keys["Space"] && bullets.length < 5) {
        bullets.push({ x: player.x + 20, y: player.y });
        keys["Space"] = false;
    }

    // Alien Movement
    let moveDown = false;
    aliens.forEach(a => {
        a.x += alienSpeed * alienDirection;
        // Check edges (using size as radius approx)
        if (a.x + a.size > canvas.width || a.x - a.size < 0) {
            moveDown = true;
        }

        // Alien Shooting Logic
        // Chance to shoot increases slightly with level
        if (Math.random() < 0.001 * level + 0.002) {
            alienBullets.push({
                x: a.x,
                y: a.y + a.size,
                width: 4,
                height: 10
            });
        }
    });

    if (moveDown) {
        alienDirection *= -1; // Reverse direction
        aliens.forEach(a => {
            a.y += 20; // Drop down
            a.x += alienSpeed * alienDirection; // Move back into screen slightly to avoid sticking
        });
    }

    // Update Alien Bullets
    for (let i = alienBullets.length - 1; i >= 0; i--) {
        let b = alienBullets[i];
        b.y += 5; // Alien bullet speed

        // Remove off-screen
        if (b.y > canvas.height) {
            alienBullets.splice(i, 1);
            continue;
        }

        // Collision with Player
        if (
            b.x < player.x + player.width &&
            b.x + b.width > player.x &&
            b.y < player.y + player.height &&
            b.y + b.height > player.y
        ) {
            lives--;
            alienBullets.splice(i, 1);
            // Visual feedback (screen shake could go here)
            if (lives <= 0) {
                gameOver();
            }
        }
    }

    // Update bullets and collisions
    // Iterate backwards to safely remove elements
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= 8;

        // Remove if off-screen
        if (b.y < 0) {
            bullets.splice(i, 1);
            continue;
        }

        // Check collision with aliens
        let hit = false;
        for (let j = aliens.length - 1; j >= 0; j--) {
            let a = aliens[j];
            if (
                b.x > a.x - a.size &&
                b.x < a.x + a.size &&
                b.y > a.y - a.size &&
                b.y < a.y + a.size
            ) {
                createExplosion(a.x, a.y);
                aliens.splice(j, 1);
                score += 100;
                hit = true;
                break; // Bullet used up
            }
        }

        if (hit) {
            bullets.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Rotation des aliens
    aliens.forEach(a => a.angle += 0.05); // Faster rotation for chaos

    // Check Level Complete
    if (aliens.length === 0) {
        nextLevel();
    }

    // Check Game Over (Alien invasion)
    aliens.forEach(a => {
        if (a.y + a.size > player.y) {
             gameOver();
        }
    });
}

function nextLevel() {
    level++;
    alienSpeed += 0.5;
    bullets = [];
    alienDirection = 1;
    initAliens();
}

/* ==========================
   RENDER
========================== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Joueur (Survivant / Croix)
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff0000";
    ctx.fillStyle = "#bbbbbb"; // Bone white/grey

    // Simple shape change: A cross-like ship
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillRect(player.x + 15, player.y - 10, 10, 10); // turret

    // Bullets (Blood fire)
    ctx.fillStyle = "#ff4400";
    bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 12));

    // Alien Bullets (Green Acid/Slime)
    ctx.fillStyle = "#00ff00";
    ctx.shadowColor = "#00ff00";
    alienBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

    // Aliens (Crânes)
    aliens.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle * 0.2); // Slight wobble

        ctx.shadowColor = "#330000";
        ctx.shadowBlur = 10;

        // Skull shape (Circle + Jaw)
        ctx.fillStyle = "#eeeeee"; // Bone color
        ctx.beginPath();
        ctx.arc(0, -5, a.size, 0, Math.PI * 2); // Head
        ctx.fill();

        // Eyes
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(-8, -5, 6, 0, Math.PI * 2);
        ctx.arc(8, -5, 6, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.beginPath();
        ctx.moveTo(0, 2);
        ctx.lineTo(-3, 8);
        ctx.lineTo(3, 8);
        ctx.fill();

        ctx.restore();
    });

    // Particules (Sang)
    particles.forEach(p => {
        ctx.shadowBlur = 0;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 40;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });

    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;
    document.getElementById("level").textContent = level;
}

/* ==========================
   GAME OVER
========================== */
function gameOver() {
    gameRunning = false;
    document.getElementById("gameOver").style.display = "flex";
}

function restart() {
    location.reload();
}

/* ==========================
   LOOP
========================== */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
