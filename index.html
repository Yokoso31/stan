<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fortnite Chess</title>
<style>
:root {
  --bg: #0b0f1a;
  --panel: #141a2a;
  --neon-blue: #00f6ff;
  --neon-purple: #b44cff;
  --neon-pink: #ff4ecd;
  --white: #e9f1ff;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #1a2150, var(--bg));
  color: var(--white);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.game {
  display: flex;
  gap: 30px;
}

.board {
  display: grid;
  grid-template-columns: repeat(8, 70px);
  grid-template-rows: repeat(8, 70px);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 40px var(--neon-blue);
}

.square {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 40px;
  cursor: pointer;
  transition: 0.2s;
}

.dark {
  background: #1b2240;
}

.light {
  background: #2c3570;
}

.square:hover {
  box-shadow: inset 0 0 15px var(--neon-blue);
}

.selected {
  box-shadow: inset 0 0 25px var(--neon-purple);
}

.move {
  box-shadow: inset 0 0 25px var(--neon-pink);
}

.panel {
  background: linear-gradient(180deg, #141a2a, #0b0f1a);
  padding: 20px;
  border-radius: 16px;
  width: 220px;
  box-shadow: 0 0 25px var(--neon-purple);
}

.panel h1 {
  margin: 0 0 10px;
  font-size: 22px;
  text-align: center;
  color: var(--neon-blue);
}

.turn {
  text-align: center;
  margin: 15px 0;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
  color: #000;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.2);
}
</style>
</head>
<body>

<div class="game">
  <div class="board" id="board"></div>

  <div class="panel">
    <h1>FORTNITE CHESS</h1>
    <div class="turn" id="turn">Tour : Blanc</div>
    <button onclick="resetGame()">Nouvelle partie</button>
  </div>
</div>

<script>
const pieces = {
  r:"♜", n:"♞", b:"♝", q:"♛", k:"♚", p:"♟",
  R:"♖", N:"♘", B:"♗", Q:"♕", K:"♔", P:"♙"
};

let boardState, selected = null, turn = "white";

function initBoard() {
  boardState = [
    "rnbqkbnr",
    "pppppppp",
    "........",
    "........",
    "........",
    "........",
    "PPPPPPPP",
    "RNBQKBNR"
  ].map(r => r.split(""));
}

const board = document.getElementById("board");

function render() {
  board.innerHTML = "";
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      const sq = document.createElement("div");
      sq.className = `square ${(x + y) % 2 ? "dark" : "light"}`;
      sq.dataset.x = x;
      sq.dataset.y = y;
      const p = boardState[y][x];
      if (p !== ".") sq.textContent = pieces[p];
      sq.onclick = () => clickSquare(x, y, sq);
      board.appendChild(sq);
    }
  }
}

function clickSquare(x, y, el) {
  const p = boardState[y][x];

  if (selected) {
    if (isLegal(selected.x, selected.y, x, y)) {
      boardState[y][x] = boardState[selected.y][selected.x];
      boardState[selected.y][selected.x] = ".";

      // Auto-promotion Pawn -> Queen
      const movedPiece = boardState[y][x];
      if (movedPiece.toLowerCase() === 'p') {
          if ((movedPiece === 'P' && y === 0) || (movedPiece === 'p' && y === 7)) {
              boardState[y][x] = movedPiece === 'P' ? 'Q' : 'q';
          }
      }

      turn = turn === "white" ? "black" : "white";
      document.getElementById("turn").textContent =
        "Tour : " + (turn === "white" ? "Blanc" : "Noir");
    }
    selected = null;
    render();
    return;
  }

  if (p !== "." && isTurnPiece(p)) {
    selected = { x, y };
    highlightMoves(x, y);
  }
}

function isTurnPiece(p) {
  if (p === ".") return false;
  return turn === "white" ? p === p.toUpperCase() : p === p.toLowerCase();
}

function isSameColor(p1, p2) {
  if (p1 === "." || p2 === ".") return false;
  const isP1White = p1 === p1.toUpperCase();
  const isP2White = p2 === p2.toUpperCase();
  return isP1White === isP2White;
}

function isPathClear(sx, sy, tx, ty) {
  const dx = Math.sign(tx - sx);
  const dy = Math.sign(ty - sy);

  let x = sx + dx;
  let y = sy + dy;

  while (x !== tx || y !== ty) {
    if (boardState[y][x] !== ".") return false;
    x += dx;
    y += dy;
  }
  return true;
}

function isLegal(sx, sy, tx, ty) {
  const p = boardState[sy][sx];
  const target = boardState[ty][tx];

  if (!isTurnPiece(p)) return false;
  if (sx === tx && sy === ty) return false;
  if (target !== "." && isSameColor(p, target)) return false;

  const dx = tx - sx;
  const dy = ty - sy;
  const adx = Math.abs(dx);
  const ady = Math.abs(dy);
  const type = p.toLowerCase();
  const isWhite = p === p.toUpperCase();

  switch (type) {
    case 'p': // Pawn
      const direction = isWhite ? -1 : 1;
      const startRow = isWhite ? 6 : 1;

      // Move forward 1
      if (dx === 0 && dy === direction && target === ".") return true;

      // Move forward 2
      if (dx === 0 && dy === direction * 2 && sy === startRow && target === "." && boardState[sy + direction][sx] === ".") return true;

      // Capture
      if (adx === 1 && dy === direction && target !== "." && !isSameColor(p, target)) return true;

      return false;

    case 'r': // Rook
      if (dx !== 0 && dy !== 0) return false;
      return isPathClear(sx, sy, tx, ty);

    case 'b': // Bishop
      if (adx !== ady) return false;
      return isPathClear(sx, sy, tx, ty);

    case 'q': // Queen
      if ((dx !== 0 && dy !== 0) && (adx !== ady)) return false;
      return isPathClear(sx, sy, tx, ty);

    case 'n': // Knight
      return (adx === 2 && ady === 1) || (adx === 1 && ady === 2);

    case 'k': // King
      return adx <= 1 && ady <= 1;
  }

  return false;
}

function highlightMoves(x, y) {
  render();
  document.querySelectorAll(".square").forEach(s => {
    if (isLegal(x, y, parseInt(s.dataset.x), parseInt(s.dataset.y))) {
      s.classList.add("move");
    }
  });
}

function resetGame() {
  turn = "white";
  document.getElementById("turn").textContent = "Tour : Blanc";
  initBoard();
  render();
}

initBoard();
render();
</script>
</body>
</html>
