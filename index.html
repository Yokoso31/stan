<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Neon Stick Fight</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at center, #0f2027, #000);
        font-family: 'Segoe UI', sans-serif;
        color: white;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: linear-gradient(#050505, #0a0a0a);
        box-shadow: 0 0 40px #00ffff;
    }

    #ui {
        position: absolute;
        top: 10px;
        width: 100%;
        display: flex;
        justify-content: space-around;
        pointer-events: none;
    }

    .bar {
        width: 300px;
        height: 20px;
        border: 2px solid #00ffff;
        box-shadow: 0 0 10px #00ffff;
    }

    .hp {
        height: 100%;
        background: linear-gradient(90deg, #00ffff, #00ff99);
    }

    h1 {
        text-align: center;
        margin: 10px;
        text-shadow: 0 0 15px #00ffff;
    }
</style>
</head>
<body>

<h1>⚔️ NEON STICK FIGHT ⚔️</h1>

<div id="ui">
    <div class="bar"><div id="hp1" class="hp"></div></div>
    <div class="bar"><div id="hp2" class="hp"></div></div>
</div>

<canvas id="game" width="1000" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRAVITY = 0.6;
const GROUND = 420;

let freezeFrames = 0;
let shake = 0;

// Power Block logic
class PowerBlock {
    constructor() {
        this.active = false;
        this.width = 40;
        this.height = 40;
        this.x = 0;
        this.y = 0;
        this.spawnTimer = 0;
    }

    update() {
        if (this.active) return; // Already spawned

        // Random spawn every ~10-15 seconds (600-900 frames)
        this.spawnTimer++;
        if (this.spawnTimer > 600 && Math.random() < 0.005) {
            this.active = true;
            this.x = 100 + Math.random() * (canvas.width - 200); // Random X
            // Lowered spawn height to be reachable: between GROUND - 50 and GROUND - 150
            // GROUND is 420. Y between 270 and 370.
            this.y = GROUND - 50 - Math.random() * 100;
            this.spawnTimer = 0;
        }
    }

    draw() {
        if (!this.active) return;

        ctx.fillStyle = "#FFD700"; // Gold color
        ctx.shadowColor = "#FFD700";
        ctx.shadowBlur = 20;
        ctx.fillRect(this.x, this.y, this.width, this.height);

        // Inner detail
        ctx.strokeStyle = "#FFF";
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y, this.width, this.height);

        // Pulse effect or text
        ctx.fillStyle = "black";
        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("P", this.x + this.width/2, this.y + 28);
    }
}

const powerBlock = new PowerBlock();

class Fighter {
    constructor(x, color, controls) {
        this.x = x;
        this.y = GROUND;
        this.vx = 0;
        this.vy = 0;
        this.width = 40;
        this.height = 80;
        this.color = color;
        this.originalColor = color;
        this.health = 100;
        this.attacking = false;
        this.controls = controls;
        this.facing = 1;
        this.invincible = false;
        this.hasPower = false;
        this.attackCooldown = false;
    }

    activatePower() {
        this.hasPower = true;
        this.color = "#FFD700"; // Gold
        setTimeout(() => {
            this.hasPower = false;
            this.color = this.originalColor;
        }, 5000); // 5 seconds duration
    }

    draw() {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.hasPower ? 30 : 15; // More glow if powered

        // Visual indicator for invincibility (blinking/opacity)
        if (this.invincible) {
            ctx.globalAlpha = 0.5;
        }

        // Tête
        ctx.beginPath();
        ctx.arc(this.x, this.y - 70, 10, 0, Math.PI * 2);
        ctx.stroke();

        // Corps
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 60);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();

        // Bras
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 40);
        ctx.lineTo(this.x + (this.attacking ? 60 * this.facing : 25 * this.facing), this.y - 30);
        ctx.stroke();

        // Attack visual effect
        if (this.attacking) {
             ctx.beginPath();
             ctx.strokeStyle = this.hasPower ? "#FFD700" : "white";
             ctx.lineWidth = this.hasPower ? 6 : 2; // Bigger swipe if powered
             ctx.moveTo(this.x + 40 * this.facing, this.y - 45);
             ctx.quadraticCurveTo(this.x + 70 * this.facing, this.y - 30, this.x + 40 * this.facing, this.y - 15);
             ctx.stroke();
             // Restore style
             ctx.strokeStyle = this.color;
             ctx.lineWidth = 4;
        }

        // Jambes
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - 15, this.y + 30);
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + 15, this.y + 30);
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0; // Reset alpha
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.y < GROUND) this.vy += GRAVITY;
        else {
            this.y = GROUND;
            this.vy = 0;
        }

        this.x = Math.max(20, Math.min(canvas.width - 20, this.x));
    }

    attack(target, type = "light") {
        // Prevent attack if already attacking OR if invincible OR if on cooldown
        if (!this.attacking && !this.invincible && !this.attackCooldown) {
            this.attacking = true;
            this.attackCooldown = true;

            // Check collision with PowerBlock
            if (powerBlock.active) {
                // Simple box collision
                // Attack range is roughly x to x + 60
                const attackRangeX = this.facing === 1 ? this.x + 60 : this.x - 60;
                // Check if powerblock is within reach
                // Simplified: distance check
                const dx = Math.abs(this.x - (powerBlock.x + powerBlock.width/2));
                const dy = Math.abs((this.y - 40) - (powerBlock.y + powerBlock.height/2)); // Assuming attack is near torso height

                if (dx < 60 && dy < 80) {
                    powerBlock.active = false;
                    this.activatePower();
                }
            }

            let damage = 10;
            if (type === "light") damage = 5;
            if (type === "heavy") damage = 15;

            if (this.hasPower) damage *= 2; // Double damage

            // Only calculate hit if target is not invincible
            if (!target.invincible) {
                const hit = Math.abs(this.x - target.x) < 50;
                if (hit) {
                    target.health -= damage;
                    freezeFrames = 6;
                    shake = 10;

                    // Apply hit effects: invincible and disable attack
                    target.invincible = true;
                    target.attacking = false; // Interrupt attack
                    setTimeout(() => target.invincible = false, 2000);
                }
            }
            // Attack duration 200ms
            setTimeout(() => this.attacking = false, 200);
            // Cooldown 500ms (total time between starts of attacks)
            setTimeout(() => this.attackCooldown = false, 500);
        }
    }
}

const keys = {};

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const p1 = new Fighter(300, "#00ffff", {
    left: "a",
    right: "d",
    jump: "w",
    attackLight: "e",
    attackHeavy: "r"
});

const p2 = new Fighter(700, "#ff00ff", {
    left: "ArrowLeft",
    right: "ArrowRight",
    jump: "ArrowUp",
    attackLight: "Enter",
    attackHeavy: "Shift"
});

function handleInput(p, enemy) {
    p.vx = 0;

    if (keys[p.controls.left.toLowerCase()]) {
        p.vx = -4;
        p.facing = -1;
    }
    if (keys[p.controls.right.toLowerCase()]) {
        p.vx = 4;
        p.facing = 1;
    }
    if (keys[p.controls.jump.toLowerCase()] && p.vy === 0) {
        p.vy = -12;
    }
    if (keys[p.controls.attackLight.toLowerCase()]) {
        p.attack(enemy, "light");
    }
    if (keys[p.controls.attackHeavy.toLowerCase()]) {
        p.attack(enemy, "heavy");
    }
}

function drawGround() {
    ctx.strokeStyle = "#00ffff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(0, GROUND + 30);
    ctx.lineTo(canvas.width, GROUND + 30);
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function updateUI() {
    document.getElementById("hp1").style.width = p1.health + "%";
    document.getElementById("hp2").style.width = p2.health + "%";
}

function gameLoop() {
    // Reset transform to clear properly
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Shake effect
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    if (freezeFrames > 0) {
        freezeFrames--;
    } else {
        powerBlock.update(); // Update spawn timer

        handleInput(p1, p2);
        handleInput(p2, p1);

        p1.update();
        p2.update();
    }

    drawGround();
    powerBlock.draw();
    p1.draw();
    p2.draw();

    updateUI();

    if (p1.health > 0 && p2.health > 0)
        requestAnimationFrame(gameLoop);
    else {
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset for text
        ctx.fillStyle = "#00ffff";
        ctx.font = "48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("FIN DU COMBAT", canvas.width / 2, canvas.height / 2);
    }
}

gameLoop();
</script>

</body>
</html>
