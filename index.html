<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pong Neon</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    canvas {
        display: block;
        margin: auto;
        background: black;
        border: 4px solid white;
        box-shadow: 0 0 20px white;
    }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(0,0,0,0.85);
        font-size: 48px;
        text-align: center;
        text-shadow: 0 0 20px white;
    }

    .overlay small {
        font-size: 20px;
        margin-top: 20px;
        opacity: 0.7;
    }

    .controls {
        font-size: 24px;
        margin-top: 30px;
        line-height: 1.5;
        color: #ddd;
        text-shadow: none;
    }

    #menu {
        margin: 20px 0;
        display: flex;
        gap: 20px;
    }

    .btn {
        background: transparent;
        border: 2px solid white;
        color: white;
        font-size: 24px;
        padding: 10px 30px;
        cursor: pointer;
        font-family: Arial, sans-serif;
        text-transform: uppercase;
        box-shadow: 0 0 10px white;
        transition: all 0.2s;
    }

    .btn:hover {
        background: white;
        color: black;
        box-shadow: 0 0 20px white;
    }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<div id="overlay" class="overlay">
    <div id="result">PONG NEON</div>

    <div id="menu">
        <button id="btn-play" class="btn">JOUER</button>
        <button id="btn-ball" class="btn">BALLE</button>
    </div>

    <div class="controls">
        <div><strong>Joueur 1</strong> : Z (Haut) / S (Bas)</div>
        <div><strong>Joueur 2</strong> : P (Haut) / M (Bas)</div>
    </div>

    <small>Ou appuyez sur ESPACE</small>
</div>

<script>
/* ==========================
   INITIALISATION
========================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const resultText = document.getElementById("result");
const btnPlay = document.getElementById("btn-play");
const btnBall = document.getElementById("btn-ball");

const paddleWidth = 12;
const paddleHeight = 90;
const ballSize = 10;
const winScore = 5;

/* ==========================
   ÉTAT DU JEU
========================== */
let gameRunning = false;
let gameOver = false;
let ballColor = "white";
let secretMode = false;
let keySequence = [];

let player1 = {
    x: 20,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let player2 = {
    x: canvas.width - 32,
    y: canvas.height / 2 - paddleHeight / 2,
    score: 0,
    speed: 6
};

let ball = resetBall();

/* ==========================
   CONTROLES
========================== */
let keys = {};

document.addEventListener("keydown", e => {
    keys[e.key] = true;

    if (e.code === "Space") {
        startGame();
    }

    // Cheat detection (Shift + A Z E)
    if (!gameRunning) {
        if (e.key === "A" || e.key === "Z" || e.key === "E") {
             keySequence.push(e.key);
             if (keySequence.length > 3) keySequence.shift();

             if (keySequence.join("") === "AZE") {
                 secretMode = !secretMode;
                 if (secretMode) {
                     resultText.textContent = "SECRET MODE ACTIVATED";
                     resultText.style.color = "#ff00ff";
                     resultText.style.textShadow = "0 0 20px #ff00ff";
                 } else {
                     resultText.textContent = "PONG NEON";
                     resultText.style.color = "white";
                     resultText.style.textShadow = "0 0 20px white";
                 }
                 keySequence = [];
             }
        } else if (e.key.length === 1) {
             keySequence = [];
        }
    }
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

btnPlay.addEventListener("click", () => {
    startGame();
});

btnBall.addEventListener("click", () => {
    const colors = ["white", "#ff0055", "#00ff55", "#0055ff", "#ffff00"];
    let currentIndex = colors.indexOf(ballColor);
    ballColor = colors[(currentIndex + 1) % colors.length];

    btnBall.style.boxShadow = `0 0 10px ${ballColor}`;
    btnBall.style.borderColor = ballColor;
    if (ballColor === "white") {
        btnBall.style.color = "white";
    } else {
        btnBall.style.color = ballColor;
    }
});

/* ==========================
   LOGIQUE
========================== */
function startGame() {
    if (!gameRunning && !gameOver) {
        gameRunning = true;
        overlay.style.display = "none";
    }
    if (gameOver) restartGame();
}

function resetBall(direction = 1) {
    return {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 6 * direction,
        vy: (Math.random() * 4 - 2)
    };
}

function restartGame() {
    player1.score = 0;
    player2.score = 0;
    gameOver = false;
    gameRunning = true;
    overlay.style.display = "none";
    ball = resetBall();
}

function update() {
    if (!gameRunning || gameOver) return;

    // Joueur 1 (Z/S)
    if (keys["z"] || keys["Z"]) player1.y -= player1.speed;
    if (keys["s"] || keys["S"]) player1.y += player1.speed;
    player1.y = Math.max(0, Math.min(canvas.height - paddleHeight, player1.y));

    // Joueur 2 (P/M)
    if (keys["p"] || keys["P"]) player2.y -= player2.speed;
    if (keys["m"] || keys["M"]) player2.y += player2.speed;
    player2.y = Math.max(0, Math.min(canvas.height - paddleHeight, player2.y));

    // Balle
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y <= 0 || ball.y >= canvas.height) {
        if (secretMode) {
             ball.vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 6 + 2);
             if (ball.y <= 0) ball.vy = Math.abs(ball.vy);
             else ball.vy = -Math.abs(ball.vy);
        } else {
             ball.vy *= -1;
        }
    }

    // Collision raquettes
    checkPaddleCollision(player1);
    checkPaddleCollision(player2);

    // Cap max speed
    if (ball.vx > 20) ball.vx = 20;
    if (ball.vx < -20) ball.vx = -20;

    // Score
    if (ball.x < 0) score(player2);
    if (ball.x > canvas.width) score(player1);
}

function checkPaddleCollision(p) {
    // AABB Collision Detection
    // Ball Hitbox: Center (ball.x, ball.y), radius/half-size = 5
    // Effectively: ball.x-5, ball.y-5, width 10, height 10

    let bLeft = ball.x - ballSize / 2;
    let bRight = ball.x + ballSize / 2;
    let bTop = ball.y - ballSize / 2;
    let bBottom = ball.y + ballSize / 2;

    let pLeft = p.x;
    let pRight = p.x + paddleWidth;
    let pTop = p.y;
    let pBottom = p.y + paddleHeight;

    // Check intersection
    if (bLeft < pRight && bRight > pLeft && bTop < pBottom && bBottom > pTop) {

        // Determine collision side by calculating overlap depth
        // Positive overlaps
        let overlapLeft = bRight - pLeft;
        let overlapRight = pRight - bLeft;
        let overlapTop = bBottom - pTop;
        let overlapBottom = pBottom - bTop;

        // Find smallest overlap
        let minOverlapX = Math.min(overlapLeft, overlapRight);
        let minOverlapY = Math.min(overlapTop, overlapBottom);

        if (minOverlapX < minOverlapY) {
            // Horizontal Collision (Front Face)

            // Resolve overlap
            if (overlapLeft < overlapRight) {
                 ball.x = pLeft - ballSize / 2;
            } else {
                 ball.x = pRight + ballSize / 2;
            }

            // Reflect and Accelerate
            ball.vx = -ball.vx; // Basic Reflection

            // Ensure direction matches side (prevent sticking inside)
            // If we hit right side of paddle (player 1 usually), ball should go right
            // If we hit left side of paddle (player 2 usually), ball should go left
            // But checking overlapLeft vs overlapRight handles "which side of paddle"
            // Wait, overlapLeft = bRight - pLeft. If small, ball is on left of paddle's right edge? No.

            // Simplified: Just invert VX, but accelerate
            ball.vx *= 1.05;

            if (secretMode) randomizeBounce();

        } else {
            // Vertical Collision (Top/Bottom Edge)

            // Resolve overlap
            if (overlapTop < overlapBottom) {
                ball.y = pTop - ballSize / 2;
            } else {
                ball.y = pBottom + ballSize / 2;
            }

            // Reflect Vertical
            ball.vy = -ball.vy;

            // Do NOT accelerate horizontal speed on edge hit
            // Maybe add friction or chaos?
        }
    }
}

function randomizeBounce() {
    ball.vy = (Math.random() * 10 - 5);
    let sign = ball.vx > 0 ? 1 : -1;
    let speed = Math.abs(ball.vx);
    ball.vx = sign * (speed + (Math.random() * 2 - 1));
}

function score(who) {
    who.score++;
    if (who.score >= winScore) endGame(who === player1);
    ball = resetBall(who === player2 ? -1 : 1);
    gameRunning = false;
}

function endGame(player1Won) {
    gameOver = true;
    overlay.style.display = "flex";
    resultText.textContent = player1Won ? "JOUEUR 1 GAGNE" : "JOUEUR 2 GAGNE";

    resultText.style.color = "white";
    resultText.style.textShadow = "0 0 20px white";
}

/* ==========================
   RENDU
========================== */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.shadowBlur = 15;

    // Raquettes
    ctx.fillStyle = "white";
    ctx.shadowColor = "white";
    ctx.fillRect(player1.x, player1.y, paddleWidth, paddleHeight);
    ctx.fillRect(player2.x, player2.y, paddleWidth, paddleHeight);

    // Balle
    if (secretMode) {
        const hue = (Date.now() / 5) % 360;
        ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
    } else {
        ctx.fillStyle = ballColor;
        ctx.shadowColor = ballColor;
    }
    ctx.fillRect(ball.x - ballSize / 2, ball.y - ballSize / 2, ballSize, ballSize);

    // Scores
    ctx.fillStyle = "white";
    ctx.shadowColor = "white";
    ctx.shadowBlur = 0;
    ctx.font = "32px Arial";
    ctx.fillText(player1.score, canvas.width / 4, 40);
    ctx.fillText(player2.score, canvas.width * 3 / 4, 40);

    // Ligne centrale
    ctx.setLineDash([10, 15]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.strokeStyle = "white";
    ctx.stroke();
}

/* ==========================
   BOUCLE PRINCIPALE
========================== */
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
