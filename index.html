        #score {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 18px;
            color: #333;
        }

        #gameOver {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            display: none;
        }

        #gameOver button {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game">
    <div id="dino"></div>
    <div id="score">Score: 0</div>

    <div id="gameOver">
        <div>Game Over</div>
        <button onclick="restart()">Rejouer</button>
    </div>
</div>

    /* ÉLÉMENTS */

    const FRAME_BASE = DINO_SPRITE;
    const FRAME_RUN1 = DINO_SPRITE;
    const FRAME_RUN2 = DINO_SPRITE;

    /* PHYSIQUE */
    let isJumping = false;
    let velocity = 0;
    const gravity = 1.2;

    /* JEU */
    let obstacles = [];
    let score = 0;
    let speed = 5;
    let gameRunning = true;
    let frame = 0;

    /* SONS */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'score') {
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    /* SAUT */
    function jump() {
        if (!isJumping) {
            velocity = 18;
            isJumping = true;
            playSound('jump');
        }
    }

    document.addEventListener("keydown", e => {
        if (e.code === "Space") jump();
    });

    document.addEventListener("click", jump);

    /* OBSTACLES */
    function createObstacle() {
        const obstacle = document.createElement("div");
        obstacle.classList.add("obstacle");
        obstacle.style.left = game.offsetWidth + "px";
        game.appendChild(obstacle);
        obstacles.push(obstacle);

        // More cactus: 800ms to 2000ms (spaced out)
        if (gameRunning) setTimeout(createObstacle, Math.random() * 1200 + 800);
    }

    /* COLLISION */
    function isColliding(a, b) {
        const r1 = a.getBoundingClientRect();
        const r2 = b.getBoundingClientRect();
        return !(
            r1.top > r2.bottom ||
            r1.bottom < r2.top ||
            r1.right < r2.left ||
            r1.left > r2.right
        );
    }

    /* BOUCLE DE JEU */
    function gameLoop() {
        if (!gameRunning) return;

        // Physique du saut
        velocity -= gravity;
        let bottom = parseFloat(getComputedStyle(dino).bottom);
        bottom += velocity;

        if (bottom <= 0) {
            bottom = 0;
            isJumping = false;
        }

        dino.style.bottom = bottom + "px";

        // Animation
        if (!isJumping) {
            frame++;
            if (frame % 10 < 5) {
                dino.style.backgroundImage = `url('${FRAME_RUN1}')`;
            } else {
                dino.style.backgroundImage = `url('${FRAME_RUN2}')`;
            }
        } else {
            dino.style.backgroundImage = `url('${FRAME_BASE}')`;
        }

        // Obstacles
        obstacles.forEach((obs, index) => {
            let left = parseFloat(obs.style.left);
            left -= speed;
            obs.style.left = left + "px";

            if (left < -20) {
                obs.remove();
                obstacles.splice(index, 1);
                score++;
                scoreDisplay.textContent = "Score: " + score;
                playSound('score');

                if (score % 4 === 0) {
                    speed += 1;
                }
            }

            if (isColliding(dino, obs)) {
                playSound('gameover');
                endGame();
            }
        });

        requestAnimationFrame(gameLoop);
    }

    /* FIN DU JEU */
    function endGame() {
        gameRunning = false;
        gameOverScreen.style.display = "flex";
    }

    /* RESTART */
    function restart() {
        obstacles.forEach(o => o.remove());
        obstacles = [];
        score = 0;
        speed = 5;
        gameRunning = true;
        gameOverScreen.style.display = "none";
        scoreDisplay.textContent = "Score: 0";
        createObstacle();
        requestAnimationFrame(gameLoop);
    }

    /* LANCEMENT */
    createObstacle();
    requestAnimationFrame(gameLoop);
</script>
