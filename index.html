<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Flappy Bird HTML5</title>
<style>
    body {
        margin: 0;
        background: #70c5ce;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    canvas {
        border: 2px solid #000;
        background: linear-gradient(#70c5ce, #fff);
    }

    .info {
        position: absolute;
        top: 20px;
        text-align: center;
        color: #fff;
        font-size: 24px;
        text-shadow: 2px 2px 0 #000;
        width: 100%;
    }
</style>
</head>
<body>

<div class="info" id="info">Clique ou appuie sur ESPACE pour commencer</div>
<canvas id="game" width="320" height="480"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

// ===== ÉTAT DU JEU =====
let gameStarted = false;
let gameOver = false;
let score = 0;

// ===== OISEAU =====
const bird = {
    x: 60,
    y: 200,
    radius: 12,
    velocity: 0,
    gravity: 0.5,
    jump: -8
};

// ===== TUYAUX =====
const pipes = [];
const pipeWidth = 50;
const pipeGap = 120;
let pipeTimer = 0;

// ===== CONTRÔLES =====
function flap() {
    if (!gameStarted) {
        gameStarted = true;
        info.textContent = "";
    }
    if (!gameOver) {
        bird.velocity = bird.jump;
    } else {
        resetGame();
    }
}

document.addEventListener("keydown", e => {
    if (e.code === "Space") flap();
});

document.addEventListener("click", flap);

// ===== RESET =====
function resetGame() {
    bird.y = 200;
    bird.velocity = 0;
    pipes.length = 0;
    score = 0;
    gameOver = false;
    gameStarted = false;
    info.textContent = "Clique ou appuie sur ESPACE pour commencer";
}

// ===== DESSINS =====
function drawBird() {
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fillStyle = "yellow";
    ctx.fill();
    ctx.stroke();
}

function drawPipes() {
    ctx.fillStyle = "green";
    pipes.forEach(p => {
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.fillRect(p.x, p.bottom, pipeWidth, canvas.height - p.bottom);
    });
}

function drawScore() {
    ctx.fillStyle = "#fff";
    ctx.font = "30px Arial";
    ctx.textAlign = "center";
    ctx.fillText(score, canvas.width / 2, 50);
}

// ===== LOGIQUE =====
function update() {
    if (!gameStarted || gameOver) return;

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Sol
    if (bird.y + bird.radius > canvas.height) {
        endGame();
    }

    // Tuyaux
    pipeTimer++;
    if (pipeTimer > 90) {
        const topHeight = Math.random() * 200 + 50;
        pipes.push({
            x: canvas.width,
            top: topHeight,
            bottom: topHeight + pipeGap,
            passed: false
        });
        pipeTimer = 0;
    }

    pipes.forEach(p => {
        p.x -= 2;

        // Collision
        if (
            bird.x + bird.radius > p.x &&
            bird.x - bird.radius < p.x + pipeWidth &&
            (bird.y - bird.radius < p.top ||
             bird.y + bird.radius > p.bottom)
        ) {
            endGame();
        }

        // Score
        if (!p.passed && p.x + pipeWidth < bird.x) {
            score++;
            p.passed = true;
        }
    });

    // Nettoyage
    if (pipes.length && pipes[0].x < -pipeWidth) {
        pipes.shift();
    }
}

function endGame() {
    gameOver = true;
    info.textContent = "Game Over – Clique ou ESPACE pour rejouer";
}

// ===== BOUCLE PRINCIPALE =====
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    update();
    drawPipes();
    drawBird();
    drawScore();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
